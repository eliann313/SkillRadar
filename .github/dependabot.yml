version: 2
updates:
    # Next.js / Node dependencies
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
          timezone: "America/Argentina/Buenos_Aires"
      open-pull-requests-limit: 10
      cooldown:
          default-days: 7
      reviewers:
          - "eliann313"
      labels:
          - "dependencies"
          - "automated"
      commit-message:
          prefix: "chore(deps)"
          prefix-development: "chore(dev-deps)"
          include: "scope"
      groups:
          # Agrupa TODAS las actualizaciones de seguridad en una sola PR
          security-updates:
              applies-to: security-updates
              patterns:
                  - "*"
          # Agrupa todas las dependencias regulares (minor y patch) para no saturar CI
          all-dependencies:
              applies-to: version-updates
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"
      ignore:
          # Pin major versions manually — review breaking changes yourself
          - dependency-name: "next"
            update-types: ["version-update:semver-major"]
          - dependency-name: "react"
            update-types: ["version-update:semver-major"]

    # GitHub Actions
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
          timezone: "America/Argentina/Buenos_Aires"
      cooldown:
          default-days: 7
      labels:
          - "dependencies"
          - "github-actions"
      commit-message:
          prefix: "chore(actions)"
      groups:
          actions:
              patterns:
                  - "*"
